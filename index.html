<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>香港金錢遊戲 | Hong Kong Money Game</title><style>
:root{--ink:#17324f;--blue:#1769aa;--line:#c7dfef;--pale:#edf7ff;--green:#16845b;--gold:#e0bd57}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#edf7ff,#fff7e4);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:var(--ink)}
button,select{font:inherit}button{cursor:pointer;touch-action:manipulation;border:2px solid var(--line);border-radius:13px;padding:10px 12px;background:white;color:var(--ink);font-weight:800}button:focus-visible,select:focus-visible{outline:3px solid #edaa28;outline-offset:2px}
header{text-align:center;padding:20px 14px 8px}h1{margin:0;color:#124e85;font-size:clamp(1.5rem,4vw,2.3rem)}header p{line-height:1.5;margin:8px auto;max-width:850px}
main{max-width:1150px;padding:10px 14px 26px;margin:auto}.panel{background:#fff;border:2px solid var(--line);border-radius:20px;padding:15px;margin:12px 0;box-shadow:0 5px 18px #224d6810}
h2,h3{margin:0 0 12px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}label{font-weight:800;display:block;margin-bottom:6px}select{width:100%;padding:10px;border:2px solid var(--line);border-radius:12px;background:white;color:var(--ink)}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.primary{background:var(--blue);color:white;border-color:var(--blue)}.teacher{background:#f3edff;border-color:#d7c6f3}.soft{background:var(--pale)}.green{background:#e3f7eb;border-color:#addfc1}
.note{font-size:.88rem;line-height:1.5;color:#53687b}.game-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(265px,.8fr);gap:12px}
.story{display:grid;grid-template-columns:1fr 1fr;gap:10px}.story-card{border:2px solid var(--line);border-radius:17px;background:#eef8ff;padding:12px;text-align:center}.story-card.price-card{background:#fff6d9;border-color:#e8ce7d}.emoji{font-size:2.6rem}.story-label{font-weight:850}.amount{font-size:clamp(1.8rem,5vw,2.8rem);font-weight:950;margin-top:4px}
.scene{text-align:center;line-height:1.5;font-weight:750}.tray{display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-height:94px;padding:10px;border:2px dashed #7fb8dc;border-radius:14px;background:#f8fcff;margin:10px 0}.empty{color:#718397;width:100%;text-align:center;padding:18px 4px}
.money-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.money-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:118px;padding:7px;background:#fffdf4;border-color:#e1cd8a}.money-btn.note-btn{background:#f2fff5;border-color:#91c8a0}.money-art{width:72px;height:58px;display:block}.money-btn.note-btn .money-art{width:100%;max-width:115px;height:53px}.money-label{font-size:1.05rem;font-weight:950}
.selected{border:2px solid #d0b04f;background:#fff1bd;border-radius:50%;min-width:59px;min-height:59px;display:grid;place-items:center;font-weight:950;color:#614c10;padding:4px}.selected.note-selected{border-radius:8px;min-width:82px;background:#dff4e5;border-color:#79b88a;color:#205b36}.selected small{font-size:10px}
.changehead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.total{font-size:1.25rem;font-weight:950}.toggle{display:flex;align-items:center;gap:8px;background:#f3f8fc;padding:8px 10px;border-radius:12px}.toggle input{width:22px;height:22px;accent-color:var(--green)}.status{min-height:28px;text-align:center;font-weight:850;margin-top:10px}.good{color:#128252}.bad{color:#b3332b}
.teacher-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hint{background:#fff5ce;border:2px solid #e9c75b;border-radius:13px;padding:12px;margin-top:10px;line-height:1.5}.hidden{display:none!important}
@media(max-width:780px){.controls{grid-template-columns:1fr 1fr}.game-grid{grid-template-columns:1fr}.money-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){main{padding:8px}.panel{padding:11px}.money-grid{gap:6px}.money-btn{min-height:103px}.teacher-grid{grid-template-columns:1fr 1fr}}

.money-art{object-fit:contain;width:90px;height:82px}.money-btn.note-btn .money-art{max-width:150px;height:82px}.money-btn{min-height:134px}.selected{border-radius:12px;display:flex;flex-direction:column;gap:3px;background:#fff}.selected .money-art{width:55px;height:49px}.selected.note-selected .money-art{width:90px;height:49px}.langbar{justify-content:center;margin:12px 0}.langbar button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}.story.payment{grid-template-columns:1fr}.source{margin-top:18px}aside .scenario{background:#edf7ff;padding:12px;border-radius:12px;margin-bottom:12px}
html{-webkit-text-size-adjust:100%}button,select{min-height:44px}img{max-width:100%}.controls>div,.game-grid>section,.game-grid>aside{min-width:0}.teacher-grid button{overflow-wrap:anywhere}@media(max-width:420px){header{padding:16px 12px 6px}.controls{gap:8px}.money-art{width:72px;height:70px}.money-btn.note-btn .money-art{height:70px}.row{gap:7px}.story-card{padding:10px}.teacher-grid{gap:7px}}
.role-buttons{display:grid;grid-template-columns:1fr;gap:9px}.role-buttons button{min-height:54px;text-align:left}.role-buttons button[aria-pressed="true"]{background:#1769aa;color:white;border-color:#1769aa;box-shadow:0 0 0 2px #b6d6ef}.role-badge{border-radius:12px;background:#e3f7eb;padding:10px 12px;font-weight:800;line-height:1.5;margin:0 0 12px}.feedback{position:relative;overflow:hidden;text-align:center;margin:12px 0 0;padding:15px;border:2px solid #b7ddc8;background:#e9f9ef;border-radius:18px}.feedback.retry{background:#fff5db;border-color:#ecd398}.feedback-icon{font-size:3rem;line-height:1.2}.feedback-title{font-size:1.35rem;font-weight:900;margin:7px 0 10px}.feedback.success .feedback-title{color:#13754b}.feedback.retry .feedback-title{color:#785a12}.sparkles{position:absolute;inset:0;pointer-events:none;display:none}.feedback.success.animate .sparkles{display:block}.sparkles span{position:absolute;font-size:20px;opacity:0;animation:starFloat 1.65s ease-out forwards}.sparkles span:nth-child(1){left:7%;top:48%;animation-delay:0s}.sparkles span:nth-child(2){left:22%;top:30%;animation-delay:.1s}.sparkles span:nth-child(3){left:37%;top:35%;animation-delay:.15s}.sparkles span:nth-child(4){left:63%;top:30%;animation-delay:.05s}.sparkles span:nth-child(5){left:78%;top:48%;animation-delay:.12s}.sparkles span:nth-child(6){left:91%;top:32%;animation-delay:.02s}.feedback.success.animate .feedback-icon{animation:happyPop .7s ease-out 2}.feedback.retry.animate .feedback-icon{animation:gentleEncourage .65s ease-in-out 2}@keyframes starFloat{0%{opacity:0;transform:translateY(20px) scale(.4)}25%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-50px) rotate(45deg) scale(1.15)}}@keyframes happyPop{0%,100%{transform:scale(1)}45%{transform:scale(1.22) rotate(8deg)}70%{transform:scale(1.08) rotate(-6deg)}}@keyframes gentleEncourage{0%,100%{transform:rotate(0)}35%{transform:rotate(-9deg)}70%{transform:rotate(9deg)}}@media(prefers-reduced-motion:reduce){.feedback.animate .feedback-icon,.sparkles span{animation:none!important}.feedback .sparkles{display:none!important}}
.review-choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}.review-choices button{min-height:64px;font-size:1.2rem}#returnedMoney .selected{background:white}#reviewArea{text-align:center}#reviewExplanation{text-align:left}.currency-photo{display:inline-flex;position:relative;align-items:center;justify-content:center;max-width:100%;flex-shrink:0}.coin-photo{flex-direction:column}.sample-mark{color:#bc252b;font-weight:700;white-space:nowrap;pointer-events:none;line-height:1.2}.coin-mark{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);font-size:10px;margin:0;text-shadow:0 0 2px #ffffffcc;z-index:1}.note-mark{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-24deg);font-size:13px;text-shadow:0 0 2px #ffffff99}.selected .coin-mark{font-size:7px;margin:0}.selected .note-mark{font-size:9px}</style></head><body>

function playWebAudio(correct){stopEffects();$('audioNotice').textContent='';if(!$('soundToggle').checked)return;const generation=audioGeneration;try{const C=window.AudioContext||window.webkitAudioContext;if(!C){$('audioNotice').textContent=t('audioUnavailable');return}if(!audioContext||audioContext.state==='closed')audioContext=new C();const schedule=()=>{if(generation!==audioGeneration||!$('soundToggle').checked)return;const now=audioContext.currentTime+.025;const notes=correct?[[523.25,0,.15],[659.25,.16,.15],[783.99,.32,.15],[1046.5,.48,.32]]:[[392,0,.18],[329.63,.24,.22]];for(const [frequency,offset,length]of notes){const osc=audioContext.createOscillator(),gain=audioContext.createGain();osc.type='sine';osc.frequency.setValueAtTime(frequency,now+offset);gain.gain.setValueAtTime(0,now+offset);gain.gain.linearRampToValueAtTime(.12,now+offset+.015);gain.gain.exponentialRampToValueAtTime(.001,now+offset+length);osc.connect(gain);gain.connect(audioContext.destination);activeOscillators.push(osc);osc.onended=()=>{osc.disconnect();gain.disconnect();activeOscillators=activeOscillators.filter(x=>x!==osc)};osc.start(now+offset);osc.stop(now+offset+length+.02)}};if(audioContext.state==='running')schedule();else Promise.resolve(audioContext.resume()).then(schedule).catch(()=>{if(generation===audioGeneration)$('audioNotice').textContent=t('audioUnavailable')})}catch(e){$('audioNotice').textContent=t('audioUnavailable')}}

function judgeReturned(decision){if(answered||!reviewing())return;if(decision===(returned===target)){answered=true;score++;setStatus('correctReview','good');render();showFeedback(true)}else{setStatus('retry','bad');showFeedback(false)}}
$('reviewYes').onclick=()=>judgeReturned(true);$('reviewNo').onclick=()=>judgeReturned(false);

$('zhUI').onclick=()=>switchUI('zh');$('enUI').onclick=()=>switchUI('en');$('start').onclick=()=>{score=0;newQuestion(true)};$('next').onclick=$('studentNext').onclick=()=>newQuestion(true);$('speak').onclick=$('teacherPlay').onclick=()=>speech($('language').value);$('yue').onclick=()=>{$('language').value='yue';speech('yue')};$('english').onclick=()=>{$('language').value='en';speech('en')};$('showHint').onclick=()=>{renderHint();$('hint').classList.remove('hidden')};$('hideHint').onclick=()=>$('hint').classList.add('hidden');$('check').onclick=()=>{if(answered||reviewing())return;const sum=selected.reduce((a,b)=>a+b,0);if(sum===target){answered=true;score++;setStatus(pay()?'correctPayment':'correctChange','good');render();showFeedback(true)}else{setStatus('retry','bad');showFeedback(false)}};$('undo').onclick=()=>{if(answered)return;selected.pop();setStatus();renderTray()};$('clear').onclick=()=>{if(answered)return;selected=[];setStatus();renderTray()};$('teacherTotal').onchange=renderTray;$('totalToggle').onchange=()=>{$('teacherTotal').checked=$('totalToggle').checked;renderTray()};['level','cap','scenario'].forEach(id=>$(id).onchange=()=>newQuestion());$('mode').onchange=()=>{$('hint').classList.toggle('hidden',$('mode').value==='challenge')};newQuestion();
})();
</script></body></html>
